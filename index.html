<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="座右銘">
<meta name="theme-color" content="#eef1ec">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="每天一句座右銘：經典語錄、自己的座右銘、存成圖片分享。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<title>每日座右銘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 版面構想：一幅掛軸。今日一句直書置中，朱印落款；語錄與自訂以素淨清單呈現。 */
:root{
  --paper:#eef1ec;      /* 青瓷紙色 */
  --surface:#f9faf7;    /* 宣紙面 */
  --ink:#1c2422;        /* 墨 */
  --muted:#5d6b66;      /* 淡墨 */
  --line:#cdd5ce;       /* 界線 */
  --seal:#b3261e;       /* 朱印 */
  --seal-ink:#fff7f2;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111715;--surface:#1a221f;--ink:#e7ece7;--muted:#96a59e;--line:#2d3934;--seal:#e0564a;--seal-ink:#1a0f0d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111715;--surface:#1a221f;--ink:#e7ece7;--muted:#96a59e;--line:#2d3934;--seal:#e0564a;--seal-ink:#1a0f0d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:calc(14px + env(safe-area-inset-top)) 20px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
header h1{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0;letter-spacing:.2em}
header .date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 20px 24px}
.view{display:none;flex-direction:column;gap:18px}
.view.on{display:flex}

/* 掛軸 */
.scroll{background:var(--surface);border-top:6px solid var(--ink);border-bottom:6px solid var(--ink);padding:30px 18px 26px;display:flex;flex-direction:row-reverse;justify-content:center;gap:18px;overflow-x:auto}
.motto{-webkit-writing-mode:vertical-rl;writing-mode:vertical-rl;font-family:var(--font-display);font-weight:700;letter-spacing:.14em;line-height:1.85;height:300px;max-height:46vh;margin:0}
.motto span{display:block}
.motto.s1{font-size:34px}.motto.s2{font-size:28px}.motto.s3{font-size:23px}.motto.s4{font-size:20px}
.meta{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:12px}
.src{-webkit-writing-mode:vertical-rl;writing-mode:vertical-rl;color:var(--muted);font-family:var(--font-display);font-weight:500;font-size:14px;letter-spacing:.12em;margin:0}
.seal{display:block;width:42px;height:42px;transform:rotate(-3deg)}
.scroll.h{flex-direction:column;align-items:stretch}
.scroll.h .motto{-webkit-writing-mode:horizontal-tb;writing-mode:horizontal-tb;height:auto;max-height:none;letter-spacing:.02em;line-height:1.6}
.scroll.h .meta{flex-direction:row;justify-content:space-between}
.scroll.h .src{-webkit-writing-mode:horizontal-tb;writing-mode:horizontal-tb}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:9px 16px;font-size:14px;min-height:42px}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.on{border-color:var(--seal);color:var(--seal)}
.btn.small{padding:5px 12px;min-height:34px;font-size:13px}
.btn.danger{border-color:var(--seal);color:var(--seal)}
.note{color:var(--muted);font-size:13px;margin:0}

h2{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.15em;margin:6px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.list .body{flex:1;min-width:0}
.list .t{font-family:var(--font-display);font-weight:500;font-size:16px;line-height:1.65;margin:0;overflow-wrap:anywhere}
.list .s{color:var(--muted);font-size:12.5px;margin:3px 0 0}
.list .s b{font-weight:400;color:var(--seal)}
.star{border:0;background:transparent;font-size:22px;line-height:1;padding:6px;min-width:40px;min-height:40px;color:var(--muted)}
.star.on{color:var(--seal)}
.rowbtns{display:flex;gap:8px;margin-top:8px}
.empty{color:var(--muted);font-size:14px;padding:18px 0}

.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--muted);min-height:36px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

form{display:flex;flex-direction:column;gap:10px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
textarea,input[type=text],select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
textarea{resize:vertical;min-height:84px;font-family:var(--font-display)}
.two{display:flex;gap:10px}.two label{flex:1;min-width:0}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--ink)}

nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;padding:13px 0 11px;font-family:var(--font-display);font-size:15px;letter-spacing:.2em;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
nav button[aria-current="page"]{color:var(--ink);font-weight:700;border-top-color:var(--seal)}

#imgView{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:var(--paper);flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));z-index:5}
#imgView.on{display:flex}
#imgView img{max-width:100%;max-height:68%;border:1px solid var(--line);-webkit-touch-callout:default}
#imgView .actions{justify-content:center}
#imgView .chips{max-width:100%;justify-content:center}
#toast{z-index:9;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>座右銘</h1>
    <span class="date" id="dateLabel"></span>
  </header>

  <main>
    <section class="view on" id="view-today" aria-label="今日一句">
      <div class="scroll" id="scroll">
        <p class="motto" id="mottoText"></p>
        <div class="meta">
          <p class="src" id="mottoSrc"></p>
          <img class="seal" id="seal" alt="崑福印" width="42" height="42">
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnFav" type="button">收藏</button>
        <button class="btn" id="btnShare" type="button">分享</button>
        <button class="btn" id="btnImage" type="button">存成圖片</button>
        <button class="btn solid" id="btnRandom" type="button">隨手翻一句</button>
      </div>
      <p class="note" id="poolNote"></p>
      <h2>近日座右銘</h2>
      <ul class="list" id="recentList"></ul>
    </section>

    <section class="view" id="view-library" aria-label="語錄">
      <input class="search" id="q" type="text" placeholder="搜尋座右銘或出處" autocomplete="off">
      <div class="chips" id="chips"></div>
      <p class="note" id="countNote"></p>
      <ul class="list" id="libList"></ul>
    </section>

    <section class="view" id="view-mine" aria-label="我的">
      <h2 id="formTitle">寫下自己的座右銘</h2>
      <form id="addForm">
        <label for="fText">座右銘
          <textarea id="fText" maxlength="120" placeholder="例如：今天比昨天好一點就夠了。"></textarea>
        </label>
        <div class="two">
          <label for="fSrc">出處或署名（可不填）
            <input id="fSrc" type="text" maxlength="30" placeholder="自勉">
          </label>
          <label for="fCat">分類
            <select id="fCat"></select>
          </label>
        </div>
        <div class="actions">
          <button class="btn solid" id="btnSave" type="submit">加入語錄</button>
          <button class="btn" id="btnCancel" type="button" hidden>取消修改</button>
        </div>
      </form>

      <h2>我的座右銘</h2>
      <ul class="list" id="mineList"></ul>

      <h2>每日一句從哪裡選</h2>
      <div class="radios" id="poolRadios">
        <label for="pool-all"><input type="radio" name="pool" id="pool-all" value="all">全部語錄</label>
        <label for="pool-mine"><input type="radio" name="pool" id="pool-mine" value="mine">只從我的座右銘</label>
        <label for="pool-fav"><input type="radio" name="pool" id="pool-fav" value="fav">只從收藏</label>
      </div>

      <h2>備份與還原</h2>
      <p class="note">資料存在這台裝置的瀏覽器裡。換手機前，先複製備份文字，再到新裝置貼上還原。</p>
      <label for="backup">備份文字
        <textarea id="backup" placeholder="把備份文字貼在這裡，再按「還原」"></textarea>
      </label>
      <div class="actions">
        <button class="btn" id="btnExport" type="button">產生並複製備份</button>
        <button class="btn" id="btnImport" type="button">還原</button>
      </div>
    </section>
  </main>

  <nav aria-label="主選單">
    <button type="button" data-view="today" aria-current="page">今日</button>
    <button type="button" data-view="library">語錄</button>
    <button type="button" data-view="mine">我的</button>
  </nav>
</div>
<div id="imgView" role="dialog" aria-label="座右銘圖片">
  <div class="chips" id="themeChips" role="group" aria-label="背景"></div>
  <img id="imgOut" alt="今日座右銘圖片">
  <p class="note">背景依日期尾數輪替五行：一六水、二七火、三八木、四九金、五十土。長按圖片即可儲存或傳到 LINE。</p>
  <div class="actions">
    <button class="btn solid" id="btnImgShare" type="button" hidden>分享圖片</button>
    <button class="btn" id="btnImgClose" type="button">關閉</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

function load(){
  try{
    var s=localStorage.getItem(KEY);
    if(s){var o=JSON.parse(s);for(var k in state){if(o && o.hasOwnProperty(k)){state[k]=o[k];}}}
  }catch(e){}
  if(!(state.custom instanceof Array)){state.custom=[];}
  if(!(state.history instanceof Array)){state.history=[];}
  if(!state.fav||typeof state.fav!=='object'){state.fav={};}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

function $(id){return document.getElementById(id);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls){e.className=cls;}if(text!=null){e.textContent=text;}return e;}
function all(){return CLASSIC.concat(state.custom);}
function byId(id){var a=all();for(var i=0;i<a.length;i++){if(a[i].id===id){return a[i];}}return null;}
function isMine(q){return q.id.charAt(0)==='u';}

/* ---------- 每日一句 ---------- */
function pad(n){return n<10?'0'+n:''+n;}
function dateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayNum(d){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);}
function poolList(){
  var list;
  if(state.pool==='mine'){list=state.custom;}
  else if(state.pool==='fav'){list=all().filter(function(q){return !!state.fav[q.id];});}
  else{list=all();}
  return list.length?list:all();
}
function poolFellBack(){
  if(state.pool==='mine'){return state.custom.length===0;}
  if(state.pool==='fav'){return all().filter(function(q){return !!state.fav[q.id];}).length===0;}
  return false;
}
/* 以「輪次」為種子洗牌：一輪內每句各出現一次，輪完才重洗。 */
function shuffled(n,seed){
  var a=[],i,j,t,s=(seed*7919+12345)%2147483646+1;
  for(i=0;i<n;i++){a.push(i);}
  for(i=n-1;i>0;i--){
    s=(s*16807)%2147483647;
    j=s%(i+1);t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function computeDaily(list,day,avoidId){
  var n=list.length,order=shuffled(n,Math.floor(day/n)),idx=day%n,q=list[order[idx]];
  if(n>1&&avoidId&&q.id===avoidId){q=list[order[(idx+1)%n]];}
  return q;
}
function pickDaily(){
  var now=new Date(),t=dateStr(now),list=poolList(),q,k;
  if(state.daily&&state.daily.date===t){
    q=byId(state.daily.id);
    if(q){for(k=0;k<list.length;k++){if(list[k].id===q.id){return q;}}}
  }
  if(state.daily&&state.daily.date!==t){
    state.history.unshift(state.daily);
    state.history=state.history.slice(0,14);
  }
  q=computeDaily(list,dayNum(now),state.history[0]?state.history[0].id:null);
  state.daily={date:t,id:q.id};
  save();
  return q;
}

function clauses(text){
  var out=[],cur='',i,c;
  for(i=0;i<text.length;i++){
    c=text.charAt(i);cur+=c;
    if('，；。？！：、'.indexOf(c)>=0&&c!=='、'){out.push(cur);cur='';}
  }
  if(cur){out.push(cur);}
  return out;
}
function currentQuote(){return (ui.random&&byId(ui.random))||pickDaily();}
function renderToday(){
  var now=new Date(),wk='日一二三四五六'.charAt(now.getDay());

  var q=currentQuote(),m=$('mottoText'),parts,i,n=q.text.length;
  var horizontal=/[A-Za-z]{3,}/.test(q.text)||n>48;
  $('scroll').className='scroll'+(horizontal?' h':'');
  m.className='motto '+(n<=10?'s1':n<=18?'s2':n<=30?'s3':'s4');
  m.textContent='';
  if(horizontal){m.textContent=q.text;}
  else{parts=clauses(q.text);for(i=0;i<parts.length;i++){m.appendChild(el('span',null,parts[i]));}}
  $('mottoSrc').textContent=q.src||'自勉';
  var fav=!!state.fav[q.id];
  $('btnFav').textContent=fav?'已收藏':'收藏';
  $('btnFav').className='btn'+(fav?' on':'');
  $('btnFav').setAttribute('aria-pressed',fav?'true':'false');
  $('btnRandom').textContent=ui.random?'回到今日一句':'隨手翻一句';
  var note='語錄共 '+all().length+' 句，其中 '+state.custom.length+' 句是你寫的。';
  if(poolFellBack()){note+=(state.pool==='mine'?'你還沒有自己的座右銘':'你還沒有收藏')+'，今日一句先從全部語錄選。';}
  $('poolNote').textContent=note;

  var ul=$('recentList');ul.textContent='';
  var shown=0;
  for(i=0;i<state.history.length&&shown<7;i++){
    var h=state.history[i],hq=byId(h.id);
    if(!hq){continue;}
    ul.appendChild(row(hq,{label:h.date.slice(5).replace('-','/')}));
    shown++;
  }
  if(!shown){ul.appendChild(el('li','empty','明天起，這裡會留下你每天看過的句子。'));}
}
function row(q,opt){
  opt=opt||{};
  var li=el('li'),body=el('div','body'),s=el('p','s');
  body.appendChild(el('p','t',q.text));
  if(opt.label){s.appendChild(el('b',null,opt.label+'　'));}
  s.appendChild(document.createTextNode((q.src||'自勉')+'．'+q.cat+(isMine(q)&&!opt.manage?'．我的':'')));
  body.appendChild(s);
  if(opt.manage){
    var rb=el('div','rowbtns'),e=el('button','btn small','修改'),d;
    e.type='button';e.setAttribute('data-act','edit');e.setAttribute('data-id',q.id);
    if(ui.confirm===q.id){d=el('button','btn small danger','確定刪除');d.setAttribute('data-act','del2');}
    else{d=el('button','btn small','刪除');d.setAttribute('data-act','del');}
    d.type='button';d.setAttribute('data-id',q.id);
    rb.appendChild(e);rb.appendChild(d);body.appendChild(rb);
  }
  li.appendChild(body);
  var on=!!state.fav[q.id],st=el('button','star'+(on?' on':''),on?'★':'☆');
  st.type='button';st.setAttribute('data-act','fav');st.setAttribute('data-id',q.id);
  st.setAttribute('aria-label',on?'取消收藏':'收藏');st.setAttribute('aria-pressed',on?'true':'false');
  li.appendChild(st);
  return li;
}

  if(!n){ul.appendChild(el('li','empty','找不到符合的座右銘。換個關鍵字，或到「我的」自己寫一句。'));}
  $('countNote').textContent='共 '+n+' 句';

function match(q,kw){
  if(ui.cat==='我的'){if(!isMine(q)){return false;}}
  else if(ui.cat==='收藏'){if(!state.fav[q.id]){return false;}}

function columnsOf(text){
  var parts=clauses(text),cols=[],i,s;
  for(i=0;i<parts.length;i++){
    s=parts[i].replace(/[，；。：、]+$/,'');
    while(s.length>12){cols.push(s.slice(0,12));s=s.slice(12);}
    if(s){cols.push(s);}
  }
  return cols;
}
function vchar(g,ch,x,y){
  if('《》〈〉（）()「」『』—…'.indexOf(ch)>=0){
    g.save();g.translate(x,y);g.rotate(Math.PI/2);g.fillText(ch,0,0);g.restore();
  }else{g.fillText(ch,x,y);}
}
function wrapLines(g,text,maxW){
  var tokens=text.match(/[A-Za-z0-9'’\-]+|\s+|[^\sA-Za-z0-9]/g)||[],lines=[],cur='',i,t;
  for(i=0;i<tokens.length;i++){
    t=tokens[i];
    if(cur&&g.measureText(cur+t).width>maxW){lines.push(cur);cur=/^\s+$/.test(t)?'':t;}
    else{cur+=t;}
  }
  if(cur){lines.push(cur);}
  return lines;
}
/* 種子亂數：同一句每次畫出同樣的山與紙紋 */
function seeded(str){
  var h=2166136261,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*16777619)>>>0;}
  return function(){h=(h*1664525+1013904223)>>>0;return h/4294967296;};
}

/* 裱綾與暗紋 */
function drawSilk(g,x,y,w,h,T){
  var gr=g.createLinearGradient(0,y,0,y+h),i,j,s;
  gr.addColorStop(0,T.silk[0]);gr.addColorStop(1,T.silk[1]);
  g.fillStyle=gr;g.fillRect(x,y,w,h);
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  g.strokeStyle=rgba(T.silkInk,0.11);g.fillStyle=rgba(T.silkInk,0.10);g.lineWidth=1.2;
  if(T.pattern==='diamond'){
    s=26;
    for(i=-h;i<w+h;i+=s){
      g.beginPath();g.moveTo(x+i,y);g.lineTo(x+i+h,y+h);g.stroke();
      g.beginPath();g.moveTo(x+i,y+h);g.lineTo(x+i+h,y);g.stroke();
    }
    for(i=0;i<w;i+=s){for(j=0;j<h;j+=s){g.fillRect(x+i+s/2-1.5,y+j-1.5,3,3);}}
  }else if(T.pattern==='seigaiha'){
    /* 青海波 */
    var r=22,row=0,k;
    for(j=y-r;j<y+h+r;j+=r*0.5,row++){
      for(i=x-r+(row%2?r:0);i<x+w+r;i+=r*2){
        for(k=3;k>=1;k--){
          g.beginPath();g.arc(i,j,r*k/3,Math.PI,0);g.stroke();
        }
      }
    }
  }else if(T.pattern==='hex'){
    /* 龜甲 */
    s=16;var hw=s*Math.sqrt(3);
    for(j=y-s,row=0;j<y+h+s;j+=s*1.5,row++){
      for(i=x-hw+(row%2?hw/2:0);i<x+w+hw;i+=hw){
        g.beginPath();
        for(k=0;k<6;k++){
          var a=Math.PI/6+k*Math.PI/3,px=i+s*Math.cos(a),py=j+s*Math.sin(a);
          if(k===0){g.moveTo(px,py);}else{g.lineTo(px,py);}
        }
        g.closePath();g.stroke();
      }
    }
  }else if(T.pattern==='meander'){
    /* 回紋 */
    s=30;
    for(i=x;i<x+w;i+=s){for(j=y;j<y+h;j+=s){
      g.strokeRect(i+4,j+4,s-8,s-8);
      g.beginPath();g.moveTo(i+s/2,j+4);g.lineTo(i+s/2,j+s/2);g.lineTo(i+s-10,j+s/2);g.stroke();
    }}
  }else{
    /* 小團花 */
    s=34;
    for(j=y,row=0;j<y+h+s;j+=s,row++){
      for(i=x+(row%2?s/2:0);i<x+w+s;i+=s){
        for(k=0;k<4;k++){
          var aa=k*Math.PI/2;
          g.beginPath();g.arc(i+Math.cos(aa)*4,j+Math.sin(aa)*4,3.2,0,Math.PI*2);g.fill();
        }
      }
    }
  }
  g.restore();
}

function drawPaper(g,x,y,w,h,rnd,T){
  var i,gr=g.createLinearGradient(x,y,x+w,y+h);
  gr.addColorStop(0,T.paper[0]);gr.addColorStop(1,T.paper[1]);
  g.fillStyle=gr;g.fillRect(x,y,w,h);
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  for(i=0;i<26;i++){
    var bx=x+rnd()*w,by=y+rnd()*h,br=40+rnd()*120,bg=g.createRadialGradient(bx,by,0,bx,by,br);
    bg.addColorStop(0,rgba(T.paperInk,0.06));bg.addColorStop(1,rgba(T.paperInk,0));
    g.fillStyle=bg;g.fillRect(bx-br,by-br,br*2,br*2);
  }
  g.lineWidth=1;
  for(i=0;i<420;i++){
    var fx=x+rnd()*w,fy=y+rnd()*h,len=8+rnd()*34,a=rnd()*Math.PI*2;
    g.strokeStyle=rgba(T.paperInk,(0.04+rnd()*0.07).toFixed(3));
    g.beginPath();g.moveTo(fx,fy);
    g.quadraticCurveTo(fx+Math.cos(a+0.6)*len*0.5,fy+Math.sin(a+0.6)*len*0.5,fx+Math.cos(a)*len,fy+Math.sin(a)*len);
    g.stroke();
  }
  if(T.key==='metal'){
    for(i=0;i<160;i++){
      var gx=x+rnd()*w,gy=y+rnd()*h,gs=1.5+rnd()*rnd()*9;
      g.fillStyle='rgba('+(190+Math.floor(rnd()*40))+','+(150+Math.floor(rnd()*40))+',60,'+(0.35+rnd()*0.4).toFixed(2)+')';
      g.save();g.translate(gx,gy);g.rotate(rnd()*Math.PI);
      g.beginPath();g.moveTo(-gs,0);g.lineTo(-gs*0.2,-gs*0.7);g.lineTo(gs,-gs*0.1);g.lineTo(gs*0.3,gs*0.8);g.closePath();g.fill();
      g.restore();
    }
  }
  g.restore();
}

/* 遠山：layers 為 [基線比例, 起伏, 濃度] */
function mountains(g,x,y,w,h,rnd,T,layers,fog){
  var k,i,px;
  for(k=0;k<layers.length;k++){
    var L=layers[k],peaks=[],np=3+Math.floor(rnd()*3);
    for(i=0;i<np;i++){peaks.push({c:rnd(),wd:0.12+rnd()*0.22,ht:0.4+rnd()*0.6});}
    g.beginPath();g.moveTo(x,y+h);
    for(px=0;px<=w;px+=6){
      var t=px/w,v=0;
      for(i=0;i<peaks.length;i++){var d=(t-peaks[i].c)/peaks[i].wd;v=Math.max(v,peaks[i].ht*Math.exp(-d*d));}
      v+=Math.sin(t*37+k*3)*0.03+Math.sin(t*91+k)*0.015;
      g.lineTo(x+px,y+h*L[0]-v*h*L[1]);
    }
    g.lineTo(x+w,y+h);g.closePath();
    var mg=g.createLinearGradient(0,y+h*(L[0]-L[1]),0,y+h);
    mg.addColorStop(0,rgba(T.ink,L[2]));mg.addColorStop(1,rgba(T.ink,L[2]*0.25));
    g.fillStyle=mg;g.fill();
    var fg=g.createLinearGradient(0,y+h*(L[0]-0.02),0,y+h*(L[0]+0.06));
    fg.addColorStop(0,'rgba('+fog+',0)');fg.addColorStop(1,'rgba('+fog+',0.55)');
    g.fillStyle=fg;g.fillRect(x,y+h*(L[0]-0.02),w,h*0.08);
  }
}
function orb(g,cx,cy,r,rgb,a,glow){
  if(glow){
    var gg=g.createRadialGradient(cx,cy,r*0.6,cx,cy,r*2.6);
    gg.addColorStop(0,rgba(rgb,a*0.5));gg.addColorStop(1,rgba(rgb,0));
    g.fillStyle=gg;g.fillRect(cx-r*3,cy-r*3,r*6,r*6);
  }
  g.fillStyle=rgba(rgb,a);g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fill();
}
function birds(g,bx,by,rnd,rgb){
  var i;g.strokeStyle=rgba(rgb,0.32);g.lineWidth=2.2;g.lineCap='round';
  for(i=0;i<3;i++){
    var ox=bx+i*22+rnd()*6,oy=by+i*12+rnd()*6,s=6+rnd()*3;
    g.beginPath();g.moveTo(ox-s,oy-s*0.3);g.quadraticCurveTo(ox-s*0.4,oy-s*0.6,ox,oy);
    g.quadraticCurveTo(ox+s*0.4,oy-s*0.6,ox+s,oy-s*0.3);g.stroke();
  }
}
/* 水：水波紋與一葉扁舟 */
function waves(g,x,y,w,h,rnd,T){
  var j,px,top=y+h*0.80;
  g.lineWidth=1.6;
  for(j=0;j<9;j++){
    var yy=top+j*(h*0.2/9),amp=2+j*0.5,ph=rnd()*6,a=0.10+j*0.012;
    g.strokeStyle=rgba(T.ink,a.toFixed(3));g.beginPath();
    for(px=0;px<=w;px+=4){
      var t=px/w,vy=yy+Math.sin(t*28+ph)*amp+Math.sin(t*61+ph*2)*amp*0.4;
      if(px===0){g.moveTo(x+px,vy);}else{g.lineTo(x+px,vy);}
    }
    g.stroke();
  }
  var bx=x+w*(0.55+rnd()*0.2),by=top+h*0.035;
  g.fillStyle=rgba(T.ink,0.42);
  g.beginPath();g.moveTo(bx-34,by);g.quadraticCurveTo(bx,by+12,bx+34,by);g.lineTo(bx+26,by+6);g.quadraticCurveTo(bx,by+14,bx-26,by+6);g.closePath();g.fill();
  g.strokeStyle=rgba(T.ink,0.42);g.lineWidth=2;g.beginPath();g.moveTo(bx+4,by+2);g.lineTo(bx-8,by-30);g.stroke();
  g.beginPath();g.arc(bx-4,by-4,5,0,Math.PI*2);g.fill();
}
/* 火：霞雲 */
function clouds(g,x,y,w,h,rnd){
  var i;
  for(i=0;i<4;i++){
    var cx=x+30+rnd()*w*0.22,cy=y+60+rnd()*h*0.16,rw=70+rnd()*70,rh=8+rnd()*8;
    g.save();g.translate(cx,cy);g.scale(1,rh/rw);
    var cg=g.createRadialGradient(0,0,0,0,0,rw);
    cg.addColorStop(0,'rgba(196,72,48,0.16)');cg.addColorStop(1,'rgba(196,72,48,0)');
    g.fillStyle=cg;g.beginPath();g.arc(0,0,rw,0,Math.PI*2);g.fill();g.restore();
  }
}
/* 木：竹 */
function bamboo(g,bx,baseY,len,lean,rnd,rgb,a,side){
  var seg=len/6,i,x0=bx,y0=baseY,x1,y1,wd=10;
  g.lineCap='butt';
  for(i=0;i<6;i++){
    x1=x0+lean*seg;y1=y0-seg;
    g.strokeStyle=rgba(rgb,a);g.lineWidth=wd;
    g.beginPath();g.moveTo(x0,y0-3);g.lineTo(x1,y1+3);g.stroke();
    g.strokeStyle=rgba(rgb,a*1.6);g.lineWidth=2;
    g.beginPath();g.moveTo(x1-wd*0.8,y1);g.lineTo(x1+wd*0.8,y1);g.stroke();
    if(i>=2&&rnd()<0.75){bambooLeaves(g,x1,y1,rnd,rgb,a*1.3,side||(rnd()<0.5?-1:1));}
    x0=x1;y0=y1;wd*=0.92;
  }
}
function bambooLeaves(g,x,y,rnd,rgb,a,dir){
  var n=2+Math.floor(rnd()*3),i;
  g.fillStyle=rgba(rgb,Math.min(a,0.5));
  for(i=0;i<n;i++){
    var ang=dir*(0.35+i*0.32+rnd()*0.2)+(dir<0?Math.PI:0),L=46+rnd()*26,W=7+rnd()*3;
    g.save();g.translate(x,y);g.rotate(ang);
    g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(L*0.4,-W,L,0);g.quadraticCurveTo(L*0.4,W,0,0);g.fill();
    g.restore();
  }
}
/* 金：銀杏葉 */
function ginkgo(g,x,y,s,rot,col){
  g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=col;
  g.beginPath();g.moveTo(0,0);
  g.quadraticCurveTo(-s*0.9,-s*0.35,-s*0.75,-s*0.95);
  g.quadraticCurveTo(-s*0.38,-s*1.12,-s*0.06,-s*0.9);
  g.lineTo(0,-s*0.72);g.lineTo(s*0.06,-s*0.9);
  g.quadraticCurveTo(s*0.38,-s*1.12,s*0.75,-s*0.95);
  g.quadraticCurveTo(s*0.9,-s*0.35,0,0);g.fill();
  g.strokeStyle=col;g.lineWidth=2;g.beginPath();g.moveTo(0,0);g.lineTo(0,s*0.45);g.stroke();
  g.restore();
}
/* 土：右下山石與一株臥松 */
function pineClump(g,cx,cy,r,rgb){
  var i,n=15;
  g.fillStyle=rgba(rgb,0.16);g.save();g.translate(cx,cy);g.scale(1,0.34);
  g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.fill();g.restore();
  g.strokeStyle=rgba(rgb,0.38);g.lineWidth=1.6;
  for(i=0;i<n;i++){
    var a=Math.PI*(1.05+0.9*i/(n-1));
    g.beginPath();g.moveTo(cx+Math.cos(a)*r*0.15,cy);g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r*0.42);g.stroke();
  }
}
function rockPine(g,x,y,w,h,rnd,T){
  var by=y+h,rw=w*0.40,rh=h*0.20,bx=x+w-rw,i;
  g.beginPath();g.moveTo(x+w,by);g.lineTo(x+w,by-rh);
  g.lineTo(bx+rw*0.78,by-rh*0.96);g.lineTo(bx+rw*0.6,by-rh*0.78);g.lineTo(bx+rw*0.44,by-rh*0.66);
  g.lineTo(bx+rw*0.28,by-rh*0.4);g.lineTo(bx+rw*0.12,by-rh*0.22);g.lineTo(bx-rw*0.05,by);g.closePath();
  var rg=g.createLinearGradient(x+w,by-rh,bx,by);
  rg.addColorStop(0,rgba(T.ink,0.22));rg.addColorStop(1,rgba(T.ink,0.07));
  g.fillStyle=rg;g.fill();
  g.strokeStyle=rgba(T.ink,0.16);g.lineWidth=1.6;
  for(i=0;i<8;i++){
    var sx=bx+rw*(0.3+rnd()*0.65),sy=by-rh*(0.1+rnd()*0.6);
    g.beginPath();g.moveTo(sx,sy);g.lineTo(sx-12-rnd()*20,sy+14+rnd()*16);g.stroke();
  }
  var tx=bx+rw*0.8,ty=by-rh*0.95;
  g.strokeStyle=rgba(T.ink,0.42);g.lineCap='round';g.lineWidth=7;
  g.beginPath();g.moveTo(tx,ty);g.bezierCurveTo(tx-8,ty-40,tx-50,ty-56,tx-120,ty-62);g.stroke();
  g.lineWidth=4;
  g.beginPath();g.moveTo(tx-30,ty-46);g.quadraticCurveTo(tx-40,ty-80,tx-70,ty-98);g.stroke();
  var cl=[[tx-128,ty-64,48],[tx-74,ty-100,40],[tx-40,ty-62,30],[tx-170,ty-56,30]];
  for(i=0;i<cl.length;i++){pineClump(g,cl[i][0],cl[i][1],cl[i][2],T.ink);}
}
function drawScene(g,x,y,w,h,rnd,T){
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  var fog=T.paper[0].replace('#',''),fr=parseInt(fog.substr(0,2),16)+','+parseInt(fog.substr(2,2),16)+','+parseInt(fog.substr(4,2),16);
  var sy=y+92+rnd()*30,i;
  if(T.key==='water'){
    orb(g,x+78,sy,44,'200,210,222',0.55,true);
    g.strokeStyle='rgba(120,136,156,0.35)';g.lineWidth=1.5;g.beginPath();g.arc(x+78,sy,44,0,Math.PI*2);g.stroke();
    mountains(g,x,y,w,h,rnd,T,[[0.72,0.10,0.06],[0.79,0.07,0.10]],fr);
    waves(g,x,y,w,h,rnd,T);
  }else if(T.key==='fire'){
    orb(g,x+80,sy+6,54,'200,52,32',0.30,true);
    clouds(g,x,y,w,h,rnd);
    mountains(g,x,y,w,h,rnd,T,[[0.70,0.16,0.07],[0.80,0.12,0.11],[0.90,0.08,0.17]],fr);
    birds(g,x+48,sy+86,rnd,T.ink);
  }else if(T.key==='wood'){
    orb(g,x+78,sy,46,'179,38,30',0.11,false);
    mountains(g,x,y,w,h,rnd,T,[[0.72,0.14,0.06],[0.82,0.10,0.09],[0.91,0.07,0.14]],fr);
    var gr='52,92,64';
    bamboo(g,x+16,y+h+10,h*0.62,0.05,rnd,gr,0.24,-1);
    bamboo(g,x+46,y+h+10,h*0.46,0.02,rnd,gr,0.18,-1);
    birds(g,x+48,sy+78,rnd,T.ink);
  }else if(T.key==='metal'){
    orb(g,x+78,sy,42,'190,160,90',0.28,false);
    mountains(g,x,y,w,h,rnd,T,[[0.76,0.12,0.06],[0.86,0.08,0.10]],fr);
    var spots=[[0.30,0.93],[0.48,0.89],[0.62,0.95],[0.78,0.88],[0.92,0.94]];
    for(i=0;i<spots.length;i++){
      ginkgo(g,x+w*spots[i][0]+rnd()*16,y+h*spots[i][1]+rnd()*16,30+rnd()*12,rnd()*Math.PI*2,'rgba(190,142,34,'+(0.42+rnd()*0.25).toFixed(2)+')');
    }
  }else{
    orb(g,x+78,sy,44,'196,140,60',0.22,false);
    mountains(g,x,y,w,h,rnd,T,[[0.70,0.15,0.07],[0.82,0.10,0.10]],fr);
    rockPine(g,x,y,w,h,rnd,T);
  }
  g.restore();
}

function drawRod(g,x,y,w,h,knob,T){
  var gr=g.createLinearGradient(0,y,0,y+h);
  gr.addColorStop(0,T.rod[0]);gr.addColorStop(0.45,T.rod[1]);gr.addColorStop(1,T.rod[2]);
  g.fillStyle=gr;g.fillRect(x,y,w,h);
  if(knob){
    var kg=g.createLinearGradient(0,y-6,0,y+h+6);
    kg.addColorStop(0,T.rod[2]);kg.addColorStop(0.5,T.rod[1]);kg.addColorStop(1,T.rod[2]);
    g.fillStyle=kg;g.fillRect(x-34,y-6,36,h+12);g.fillRect(x+w-2,y-6,36,h+12);
  }
}

function drawCard(q,ti){
  var W=1080,H=1350,c=document.createElement('canvas'),g,i,j,now=new Date();
  if(ti==null){ti=themeFor(now);}
  var T=THEMES[ti];
  c.width=W;c.height=H;g=c.getContext('2d');
  var INK='rgb('+T.ink+')',MUTED=rgba(T.ink,0.68),rnd=seeded(q.id+q.text+T.key);
  var SL=130,SR=950,ST=118,SB=1222,PL=180,PR=900,PT=232,PB=1092,PW=PR-PL,PH=PB-PT;
  drawWall(g,W,H,T);
  g.strokeStyle=T.string;g.lineWidth=3;
  g.beginPath();g.moveTo(SL+170,104);g.lineTo(W/2,40);g.lineTo(SR-170,104);g.stroke();
  g.fillStyle=T.string;g.beginPath();g.arc(W/2,38,7,0,Math.PI*2);g.fill();
  g.save();g.shadowColor='rgba(0,0,0,0.45)';g.shadowBlur=40;g.shadowOffsetY=18;
  g.fillStyle=T.silk[1];g.fillRect(SL,ST,SR-SL,SB-ST);g.restore();
  drawSilk(g,SL,ST,SR-SL,SB-ST,T);
  g.strokeStyle=rgba(T.frame,0.55);g.lineWidth=2;g.strokeRect(PL-14,PT-14,PW+28,PH+28);
  g.strokeStyle=rgba(T.frame,0.35);g.lineWidth=1;g.strokeRect(PL-22,PT-22,PW+44,PH+44);
  drawPaper(g,PL,PT,PW,PH,rnd,T);
  drawScene(g,PL,PT,PW,PH,rnd,T);
  drawRod(g,SL-8,100,SR-SL+16,20,false,T);
  drawRod(g,SL-14,SB-4,SR-SL+28,32,true,T);

  g.textAlign='center';g.textBaseline='middle';
  var src=q.src||'自勉',horizontal=/[A-Za-z]{3,}/.test(q.text)||q.text.length>48;
  var stamp=now.getFullYear()+'.'+pad(now.getMonth()+1)+'.'+pad(now.getDate());
  if(!horizontal){
    var cols=columnsOf(q.text),n=cols.length,maxLen=1;
    for(i=0;i<n;i++){if(cols[i].length>maxLen){maxLen=cols[i].length;}}
    var left=PL+150,right=PR-50,availW=right-left,top=PT+70,availH=PH-70-170;
    var size=Math.min(100,Math.floor(availH/(maxLen*1.16)),Math.floor(availW/(n*1.6)));
    var step=size*1.16,colW=size*1.6,x0=left+(availW+n*colW)/2-colW/2,y0=top+(availH-maxLen*step)*0.25;
    g.fillStyle=INK;g.font='700 '+size+'px '+CARD_FONT;
    for(i=0;i<n;i++){for(j=0;j<cols[i].length;j++){vchar(g,cols[i].charAt(j),x0-i*colW,y0+(j+0.5)*step);}}
    var sx=PL+78,sealY=PB-120,srcTop=PT+200,srcAvail=sealY-72-srcTop,ss=Math.min(34,Math.floor(srcAvail/(src.length*1.18))),sstep=ss*1.18,sy=sealY-72-src.length*sstep;
    g.fillStyle=MUTED;g.font='500 '+ss+'px '+CARD_FONT;
    for(j=0;j<src.length;j++){vchar(g,src.charAt(j),sx,sy+(j+0.5)*sstep);}
    drawSeal(g,sx,sealY);
  }else{
    var hs=q.text.length>60?44:54,lines,lh;
    g.font='700 '+hs+'px '+CARD_FONT;g.fillStyle=INK;g.textAlign='left';
    lines=wrapLines(g,q.text,PW-140);lh=hs*1.7;
    var ty=Math.max(PT+150,PT+(PH-lines.length*lh)/2-120);
    for(i=0;i<lines.length;i++){g.fillText(lines[i],PL+70,ty+i*lh);}
    g.fillStyle=MUTED;g.font='500 32px '+CARD_FONT;g.textAlign='right';
    g.fillText('—— '+src,PR-140,ty+lines.length*lh+50);
    g.textAlign='center';
    drawSeal(g,PR-80,ty+lines.length*lh+50);
  }
  g.fillStyle=rgba(T.foot,0.8);g.font='500 24px '+CARD_FONT;g.textAlign='center';
  g.fillText('每日座右銘　'+stamp+'　'+T.tag+'．'+T.el,W/2,(PB+22+SB)/2);
  return c;
}

function openImage(ti){
  var q=currentQuote(),done=false;
  imgTheme=(ti==null)?themeFor(new Date()):ti;
  function go(){
    if(done){return;}done=true;
    var c;
    try{c=drawCard(q,imgTheme);$('imgOut').src=c.toDataURL('image/png');}
    catch(e){toast('這個瀏覽器無法產生圖片');return;}
    cardBlob=null;$('btnImgShare').hidden=true;
    try{
      if(c.toBlob&&navigator.canShare&&typeof File==='function'){
        c.toBlob(function(b){
          try{
            var f=new File([b],'motto.png',{type:'image/png'});
            if(navigator.canShare({files:[f]})){cardBlob=f;$('btnImgShare').hidden=false;}
          }catch(e){}
        },'image/png');
      }

    renderThemeChips();
    $('imgView').className='on';

    if(started){return;}started=true;
    try{
      if(document.fonts&&document.fonts.load){
        document.fonts.load('700 60px "Noto Serif TC"',q.text+(q.src||'')+'崑福每日座右銘五十同途一六共宗二七同道三八為朋四九為友水火木金土').then(go,go);
        setTimeout(go,1500);
        return;
      }
    }catch(e){}
    go();
  }
  if(sealImg.complete&&sealImg.naturalWidth){fontsThenGo();}
  else{sealImg.onload=fontsThenGo;sealImg.onerror=fontsThenGo;setTimeout(fontsThenGo,1500);}
}

var toastTimer=null;
function toast(msg){
  var t=$('toast');t.textContent=msg;t.className='show';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='';},2200);
}
function copyText(text,okMsg){
  function fallback(){
    var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);
    toast(ok?okMsg:'無法自動複製，請長按文字手動複製');
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){toast(okMsg);},fallback);
    }else{fallback();}
  }catch(e){fallback();}
}

function onListClick(ev){
  var b=ev.target;
  while(b&&b!==this&&!(b.getAttribute&&b.getAttribute('data-act'))){b=b.parentNode;}
  if(!b||b===this){return;}
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id'),q=byId(id),i;
  if(act==='fav'){toggleFav(id);}
  else if(act==='edit'&&q){
    ui.editing=id;ui.confirm=null;
    $('fText').value=q.text;$('fSrc').value=q.src||'';$('fCat').value=q.cat;
    renderMine();document.querySelector('main').scrollTop=0;$('fText').focus();
  }
  else if(act==='del'){ui.confirm=id;renderMine();}
  else if(act==='del2'){
    for(i=0;i<state.custom.length;i++){if(state.custom[i].id===id){state.custom.splice(i,1);break;}}
    delete state.fav[id];
    if(ui.editing===id){resetForm();}
    if(ui.random===id){ui.random=null;}
    ui.confirm=null;save();render();toast('已刪除');
  }
}
function resetForm(){ui.editing=null;$('fText').value='';$('fSrc').value='';}

function init(){
  load();
  $('seal').src=SEAL_SRC;
  var sel=$('fCat'),opts=CATS.concat(['其他']),i,o;
  for(i=0;i<opts.length;i++){o=el('option',null,opts[i]);o.value=opts[i];sel.appendChild(o);}
  render();

  document.querySelector('nav').addEventListener('click',function(ev){
    var v=ev.target.getAttribute&&ev.target.getAttribute('data-view');
    if(v){show(v);}
  });
  $('btnFav').addEventListener('click',function(){toggleFav(currentQuote().id);});
  $('btnRandom').addEventListener('click',function(){
    if(ui.random){ui.random=null;}
    else{
      var a=all(),cur=currentQuote().id,q;
      do{q=a[Math.floor(Math.random()*a.length)];}while(a.length>1&&q.id===cur);
      ui.random=q.id;
    }
    renderToday();
  });
  $('btnShare').addEventListener('click',function(){
    var q=currentQuote(),text=q.text+'\n—— '+(q.src||'自勉');
    if(navigator.share){
      try{
        navigator.share({text:text}).then(null,function(err){
          if(!err||err.name!=='AbortError'){copyText(text,'已複製，可以貼到 LINE');}
        });
        return;
      }catch(e){}
    }
    copyText(text,'已複製，可以貼到 LINE');
  });

  $('btnImage').addEventListener('click',function(){openImage();});
  $('themeChips').addEventListener('click',function(ev){
    var t=ev.target.getAttribute&&ev.target.getAttribute('data-theme');
    if(t!=null&&t!==''){openImage(parseInt(t,10));}
  });
  $('btnImgClose').addEventListener('click',function(){$('imgView').className='';});
  $('btnImgShare').addEventListener('click',function(){
    if(!cardBlob){return;}
    try{navigator.share({files:[cardBlob]}).then(null,function(){});}
    catch(e){toast('無法直接分享，請長按圖片儲存');}
  });

  $('recentList').addEventListener('click',onListClick);
  $('libList').addEventListener('click',onListClick);
  $('mineList').addEventListener('click',onListClick);
  $('q').addEventListener('input',renderLibrary);
  $('chips').addEventListener('click',function(ev){
    var c=ev.target.getAttribute&&ev.target.getAttribute('data-cat');
    if(c){ui.cat=c;renderLibrary();}
  });

  $('addForm').addEventListener('submit',function(ev){
    ev.preventDefault();
    var text=$('fText').value.replace(/\s+/g,' ').replace(/^ | $/g,''),src=$('fSrc').value.replace(/^\s+|\s+$/g,''),cat=$('fCat').value,q;
    if(!text){toast('請先寫下座右銘');$('fText').focus();return;}
    if(ui.editing&&(q=byId(ui.editing))){
      q.text=text;q.src=src;q.cat=cat;toast('已儲存修改');
    }else{
      state.custom.push({id:'u'+new Date().getTime().toString(36),text:text,src:src,cat:cat});
      toast('已加入語錄');
    }
    resetForm();save();render();
  });
  $('btnCancel').addEventListener('click',function(){resetForm();renderMine();});

  $('poolRadios').addEventListener('change',function(ev){
    if(ev.target.name==='pool'){
      state.pool=ev.target.value;state.daily=null;ui.random=null;save();render();
      toast('已更新今日一句的來源');
    }
  });

  $('btnExport').addEventListener('click',function(){
    var text=JSON.stringify({app:'motto',v:1,custom:state.custom,fav:state.fav,pool:state.pool});
    $('backup').value=text;copyText(text,'備份文字已複製');
  });
  $('btnImport').addEventListener('click',function(){
    var o,added=0,i,j,c,dup;
    try{o=JSON.parse($('backup').value);}catch(e){o=null;}
    if(!o||!(o.custom instanceof Array)){toast('備份文字格式不對，請整段重新貼上');return;}
    for(i=0;i<o.custom.length;i++){
      c=o.custom[i];
      if(!c||typeof c.text!=='string'||!c.text){continue;}
      dup=false;
      for(j=0;j<state.custom.length;j++){if(state.custom[j].text===c.text){dup=true;break;}}
      if(dup){continue;}
      state.custom.push({id:(typeof c.id==='string'&&c.id.charAt(0)==='u'&&!byId(c.id))?c.id:'u'+(new Date().getTime()+i).toString(36),
        text:c.text.slice(0,120),src:typeof c.src==='string'?c.src.slice(0,30):'',cat:typeof c.cat==='string'?c.cat:'其他'});
      added++;
    }
    if(o.fav&&typeof o.fav==='object'){for(var k in o.fav){if(o.fav.hasOwnProperty(k)&&byId(k)){state.fav[k]=1;}}}
    save();render();$('backup').value='';
    toast('已還原，新增 '+added+' 句');
  });

  /* 跨過午夜或回到前景時，換上新的一天 */
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&(!state.daily||state.daily.date!==dateStr(new Date()))){ui.random=null;renderToday();}
  });
}
init();

/* 離線快取：只在 https 或 localhost 註冊 */
try{
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(null,function(){});});
  }
}catch(e){}
})();
</script>
</body>
</html>
